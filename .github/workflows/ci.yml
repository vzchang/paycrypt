name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features

  no_std:
    name: no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build without default features
        run: cargo build --workspace --no-default-features

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

  differential:
    name: differential (moov-io + psec)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install references
        run: |
          pip install psec==1.3.0
          go mod init paycrypt-refs
          go get github.com/moov-io/dukpt@v1.0.0
          go mod tidy
          go build -o "$RUNNER_TEMP/ref_moov" ./scripts/ref_moov.go
          echo "REF_MOOV_BIN=$RUNNER_TEMP/ref_moov" >> "$GITHUB_ENV"
      - name: Run differential tests
        run: cargo test --workspace -- --ignored

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Smoke each target
        run: |
          for t in from_hex parse_ksn decode_pinblock; do
            # rust-toolchain.toml pins stable; cargo-fuzz needs nightly's -Z flags
            cargo +nightly fuzz run "$t" -- -max_total_time=60
          done

  mutants:
    name: mutation (dukpt core, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-mutants
        uses: taiki-e/install-action@cargo-mutants
      - name: Mutate the derivation core
        run: cargo mutants --package paycrypt-dukpt --file crates/paycrypt-dukpt/src/tdes.rs
