name: Deploy explainer site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: "20" # any Node >=16 works; the Vite 4 toolchain is verified on Node 16
      - name: Build WASM package
        run: wasm-pack build crates/paycrypt-wasm --target web --out-dir pkg
      - name: Build site
        run: |
          cd site
          npm ci || npm install
          npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  screenshot:
    name: visual check (Playwright)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Build site
        run: |
          wasm-pack build crates/paycrypt-wasm --target web --out-dir pkg
          cd site && (npm ci || npm install) && npm run build
      - name: Capture screenshot
        run: |
          cd site
          npm install --no-save playwright http-server
          npx playwright install --with-deps chromium
          npx http-server dist -p 4173 &
          npx wait-on http://localhost:4173 || sleep 3
          node scripts/screenshot.mjs
      - name: Upload screenshot
        uses: actions/upload-artifact@v7
        with:
          name: site-screenshot
          path: site/screenshot.png

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
