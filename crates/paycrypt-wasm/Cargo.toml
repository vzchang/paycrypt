[package]
name = "paycrypt-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "WASM bindings that run the real paycrypt library in the browser."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
paycrypt-dukpt = { path = "../paycrypt-dukpt", features = ["std"] }
paycrypt-pinblock = { path = "../paycrypt-pinblock", features = ["std"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_bytes = "0.11"
getrandom = { version = "0.2", features = ["js"] }
